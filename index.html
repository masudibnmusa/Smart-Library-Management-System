<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <!-- Using FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --light-bg: #f4f4f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--light-bg);
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        /* Form Styling */
        .book-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: var(--secondary-color);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { background-color: #2980b9; }

        /* Search Bar */
        .search-box {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        /* Book Grid Display */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            transition: transform 0.2s;
        }

        .book-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: white;
        }

        .status-available { background-color: var(--success-color); }
        .status-issued { background-color: var(--accent-color); }

        .action-btns {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .borrow-btn { background-color: #f39c12; }
        .return-btn { background-color: var(--success-color); }
        
        /* Hide buttons based on status */
        .hide { display: none; }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><i class="fas fa-book-open"></i> Library Management System</h1>
        <p>Add, Search, Borrow, and Return books.</p>
    </header>

    <!-- Section 1: Add Book -->
    <div class="book-form">
        <input type="text" id="titleInput" placeholder="Book Title">
        <input type="text" id="authorInput" placeholder="Author Name">
        <input type="number" id="yearInput" placeholder="Year (e.g., 2023)">
        <input type="text" id="isbnInput" placeholder="ISBN Number">
        <button onclick="addBook()">Add Book</button>
    </div>

    <!-- Section 2: Search -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search by title or author...">
        <button onclick="searchBooks()"><i class="fas fa-search"></i></button>
    </div>

    <!-- Section 3: Book List -->
    <h3>All Books</h3>
    <br>
    <div id="bookList" class="book-grid">
        <!-- Books will be inserted here by JavaScript -->
    </div>
</div>

<script>
    // 1. Initialize Data (Check LocalStorage or start with empty array)
    let books = JSON.parse(localStorage.getItem('libraryBooks')) || [];

    // DOM Elements
    const titleInput = document.getElementById('titleInput');
    const authorInput = document.getElementById('authorInput');
    const yearInput = document.getElementById('yearInput');
    const isbnInput = document.getElementById('isbnInput');
    const searchInput = document.getElementById('searchInput');
    const bookList = document.getElementById('bookList');

    // Function to Render Books to the screen
    function renderBooks(bookArray) {
        bookList.innerHTML = ''; // Clear existing list

        if (bookArray.length === 0) {
            bookList.innerHTML = '<p>No books found. Add some above!</p>';
            return;
        }

        bookArray.forEach(book => {
            const card = document.createElement('div');
            card.classList.add('book-card');

            // Determine status HTML
            const statusClass = book.status === 'Available' ? 'status-available' : 'status-issued';
            const statusText = book.status === 'Available' ? 'Available' : 'Issued';

            card.innerHTML = `
                <span class="status-badge ${statusClass}">${statusText}</span>
                <h2>${book.title}</h2>
                <p><i class="fas fa-user"></i> ${book.author}</p>
                <small><i class="fas fa-calendar-alt"></i> ${book.year}</small>
                <br>
                <strong>ISBN: </strong> <span style="font-family: monospace;">${book.isbn}</span>

                <div class="action-btns">
                    ${book.status === 'Available' 
                        ? `<button onclick="borrowBook(${book.id})" class="borrow-btn"><i class="fas fa-hand-holding"></i> Borrow</button>` 
                        : ''}
                    
                    ${book.status === 'Issued' 
                        ? `<button onclick="returnBook(${book.id})" class="return-btn"><i class="fas fa-check"></i> Return</button>` 
                        : ''}

                    <button onclick="deleteBook(${book.id})" style="background-color:#e74c3c;"><i class="fas fa-trash"></i></button>
                </div>
            `;
            
            bookList.appendChild(card);
        });
    }

    // Function: Add New Book
    function addBook() {
        const title = titleInput.value;
        const author = authorInput.value;
        const year = yearInput.value;
        const isbn = isbnInput.value;

        if (title === '' || author === '' || year === '' || isbn === '') {
            alert('Please fill in all fields!');
            return;
        }

        // Create new book object
        const newBook = {
            id: Date.now(), // Unique ID based on time
            title,
            author,
            year,
            isbn,
            status: 'Available' // Default status
        };

        books.push(newBook);
        saveAndRender();

        // Clear inputs
        titleInput.value = '';
        authorInput.value = '';
        yearInput.value = '';
        isbnInput.value = '';
    }

    // Function: Borrow Book
    function borrowBook(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.status = 'Issued';
            saveAndRender();
        }
    }

    // Function: Return Book
    function returnBook(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.status = 'Available';
            saveAndRender();
        }
    }

    // Function: Delete Book
    function deleteBook(id) {
        if(confirm('Are you sure you want to delete this book?')) {
            books = books.filter(b => b.id !== id);
            saveAndRender();
        }
    }

    // Function: Search Books
    function searchBooks() {
        const keyword = searchInput.value.toLowerCase();
        const filteredBooks = books.filter(book => 
            book.title.toLowerCase().includes(keyword) || 
            book.author.toLowerCase().includes(keyword)
        );
        renderBooks(filteredBooks);
    }

    // Helper: Save to LocalStorage and Re-render
    function saveAndRender() {
        localStorage.setItem('libraryBooks', JSON.stringify(books));
        // If there's a search active, keep it. Otherwise render all.
        if(searchInput.value) {
            searchBooks();
        } else {
            renderBooks(books);
        }
    }

    // Initial Render on Page Load
    renderBooks(books);

    // Event Listener: Search on 'Enter' key
    searchInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') searchBooks();
    });

</script>

</body>
</html>
