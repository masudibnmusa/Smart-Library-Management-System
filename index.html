<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System - Login</title>
    <!-- Using FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --light-bg: #f4f4f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--light-bg);
            color: #333;
            height: 100vh;
            overflow: hidden; /* Prevent scrolling on login screen */
        }

        /* ======================= 
           LOGIN SCREEN STYLES 
           ======================= */
        #login-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary-color), #3498db);
            display: flex; /* Always visible initially */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }

        .login-logo {
            font-size: 50px;
            color: var(--secondary-color);
            margin-bottom: 10px;
        }

        .login-inputs {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .login-inputs input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        .btn-login {
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-login:hover { background-color: #1a252f; }
        
        .login-alert { color: var(--accent-color); margin-top: 10px; font-size: 0.9rem; display: none;}

        /* ======================= 
           SYSTEM INTERFACE STYLES (Initially Hidden)
           ======================= */
        #system-interface {
            display: none; /* Hidden until logged in */
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            background-color: var(--accent-color);
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            color: white;
        }

        /* Form Styling */
        .book-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            background: #ecf0f1;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: var(--secondary-color);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { filter: brightness(1.1); }

        /* Search Bar */
        .search-box {
            width: 100%;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
        }

        /* Book Grid Display */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            transition: transform 0.2s;
        }

        .book-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .status-badge {
            position: absolute;
            top: 10px; right: 10px;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: white;
        }

        .status-available { background-color: var(--success-color); }
        .status-issued { background-color: var(--accent-color); }

        .action-btns {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .borrow-btn { background-color: #f39c12; }
        .return-btn { background-color: var(--success-color); }
        
        .hide { display: none; }

    </style>
</head>
<body>

    <!-- ======================= 
         1. LOGIN SCREEN 
         ======================= -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo"><i class="fas fa-book-reader"></i></div>
            <h2>Library Login</h2>
            
            <!-- Mock Credentials: Use admin / 1234 -->
            <div class="login-inputs">
                <input type="email" id="loginEmail" placeholder="Enter your username " value="admin@lib.com">
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>

            <button class="btn-login" onclick="attemptLogin()">Login</button>
            <p id="loginError" class="login-alert">Invalid Credentials</p>
        </div>
    </div>

    <!-- ======================= 
         2. MAIN SYSTEM INTERFACE 
         ======================= -->
    <div id="system-interface">
        <div class="container">
            <header>
                <div>
                    <h1><i class="fas fa-book-open"></i> Library Dashboard</h1>
                    <p>Welcome back!</p>
                </div>
                <!-- Logout Button -->
                <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </header>

            <!-- Add Book Form -->
            <div class="book-form">
                <input type="text" id="titleInput" placeholder="Book Title">
                <input type="text" id="authorInput" placeholder="Author Name">
                <input type="number" id="yearInput" placeholder="Year (e.g., 2023)">
                <input type="text" id="isbnInput" placeholder="ISBN Number">
                <button onclick="addBook()">Add Book</button>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by title or author...">
                <button onclick="searchBooks()"><i class="fas fa-search"></i></button>
            </div>

            <!-- Books Grid -->
            <h3>All Books</h3>
            <br>
            <div id="bookList" class="book-grid">
                <!-- JS will inject books here -->
            </div>
        </div>
    </div>

<script>
    // --- System Data Logic ---
    let books = JSON.parse(localStorage.getItem('libraryBooks')) || [];
    
    const loginScreen = document.getElementById('login-screen');
    const systemInterface = document.getElementById('system-interface');
    const titleInput = document.getElementById('titleInput');
    const authorInput = document.getElementById('authorInput');
    const yearInput = document.getElementById('yearInput');
    const isbnInput = document.getElementById('isbnInput');
    const searchInput = document.getElementById('searchInput');
    const bookList = document.getElementById('bookList');
    const loginError = document.getElementById('loginError');

    // Function to Render Books
    function renderBooks(bookArray) {
        bookList.innerHTML = ''; 
        
        if (bookArray.length === 0) {
            bookList.innerHTML = '<p>No books found. Add some above!</p>';
            return;
        }

        bookArray.forEach(book => {
            const card = document.createElement('div');
            card.classList.add('book-card');

            const statusClass = book.status === 'Available' ? 'status-available' : 'status-issued';
            const statusText = book.status === 'Available' ? 'Available' : 'Issued';

            card.innerHTML = `
                <span class="status-badge ${statusClass}">${statusText}</span>
                <h2>${book.title}</h2>
                <p><i class="fas fa-user"></i> ${book.author}</p>
                <small><i class="fas fa-calendar-alt"></i> ${book.year}</small>
                <br>
                <strong>ISBN: </strong> <span style="font-family: monospace;">${book.isbn}</span>

                <div class="action-btns">
                    ${book.status === 'Available' 
                        ? `<button onclick="borrowBook(${book.id})" class="borrow-btn"><i class="fas fa-hand-holding"></i> Borrow</button>` 
                        : ''}
                    
                    ${book.status === 'Issued' 
                        ? `<button onclick="returnBook(${book.id})" class="return-btn"><i class="fas fa-check"></i> Return</button>` 
                        : ''}

                    <button onclick="deleteBook(${book.id})" style="background-color:#e74c3c;"><i class="fas fa-trash"></i></button>
                </div>
            `;
            bookList.appendChild(card);
        });
    }

    function addBook() {
        const title = titleInput.value;
        const author = authorInput.value;
        const year = yearInput.value;
        const isbn = isbnInput.value;

        if (title === '' || author === '' || year === '' || isbn === '') {
            alert('Please fill in all fields!');
            return;
        }

        const newBook = {
            id: Date.now(), 
            title,
            author,
            year,
            isbn,
            status: 'Available' 
        };

        books.push(newBook);
        saveAndRender();
        
        // Clear inputs
        titleInput.value = '';
        authorInput.value = '';
        yearInput.value = '';
        isbnInput.value = '';
    }

    function borrowBook(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.status = 'Issued';
            saveAndRender();
        }
    }

    function returnBook(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.status = 'Available';
            saveAndRender();
        }
    }

    function deleteBook(id) {
        if(confirm('Are you sure you want to delete this book?')) {
            books = books.filter(b => b.id !== id);
            saveAndRender();
        }
    }

    function searchBooks() {
        const keyword = searchInput.value.toLowerCase();
        const filteredBooks = books.filter(book => 
            book.title.toLowerCase().includes(keyword) || 
            book.author.toLowerCase().includes(keyword)
        );
        renderBooks(filteredBooks);
    }

    function saveAndRender() {
        localStorage.setItem('libraryBooks', JSON.stringify(books));
        if(searchInput.value) {
            searchBooks();
        } else {
            renderBooks(books);
        }
    }

    // --- Authentication Logic ---

    function attemptLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        // Mock Login Credentials: admin / 1234
        if (email === "admin@lib.com" && password === "1234") {
            loginScreen.style.display = 'none';
            systemInterface.style.display = 'block';
            document.body.style.overflow = 'auto'; // Allow scrolling inside the system
            
            renderBooks(books); // Load initial books
        } else {
            loginError.style.display = 'block';
        }
    }

    function logout() {
        // Reset fields
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
        
        systemInterface.style.display = 'none';
        loginScreen.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        loginError.style.display = 'none';
    }

</script>

</body>
</html>
