<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library System - Login & Register</title>
    <!-- Using FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --success-color: #27ae60;
            --light-bg: #f4f4f4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--light-bg);
            color: #333;
            height: 100vh;
            overflow-x: hidden;
        }

        /* ======================= 
           AUTHENTICATION PAGES (Login & Register)
           ======================= */
        .auth-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--primary-color), #3498db);
            display: flex; /* Shown initially */
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 380px;
        }

        .auth-logo { font-size: 50px; color: var(--secondary-color); margin-bottom: 10px; text-align: center; }
        .auth-title { text-align: center; margin-bottom: 20px; font-weight: bold; color: var(--primary-color); }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 5px; }
        
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; outline: none; background: #f9f9f9;}
        
        button.btn-primary {
            width: 100%; padding: 12px; background-color: var(--secondary-color); color: white; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        
        button.btn-primary:hover { filter: brightness(1.1); }

        .auth-alert { color: var(--accent-color); margin-top: 10px; font-size: 0.9rem; display: none;}
        
        .toggle-link { text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--secondary-color); cursor: pointer; }

        /* ======================= 
           MAIN SYSTEM INTERFACE (Hidden Initially)
           ======================= */
        #system-interface {
            display: none; 
            height: 100%;
            padding: 20px;
            overflow-y: auto;
        }

        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }

        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid var(--primary-color); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center;}
        
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 40px; height: 40px; background: var(--secondary-color); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center;}

        .logout-btn { background-color: var(--accent-color); padding: 5px 15px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; color: white; }
        
        .book-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: #ecf0f1; padding: 20px; border-radius: 5px; margin-bottom: 20px;}
        button { padding: 10px 20px; border: none; background-color: var(--secondary-color); color: white; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        button:hover { filter: brightness(1.1); }

        .search-box { width: 100%; margin-bottom: 20px; display: flex; justify-content: space-between;}
        
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;}
        
        .book-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; position: relative; transition: transform 0.2s;}
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
        
        .status-badge { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; color: white;}
        .status-available { background-color: var(--success-color); }
        .status-issued { background-color: var(--accent-color); }

        .action-btns { margin-top: 15px; display: flex; gap: 10px;}
        .borrow-btn { background-color: #f39c12; }
        .return-btn { background-color: var(--success-color); }

    </style>
</head>
<body>

    <!-- ======================= 
         AUTH SCREEN (Login & Register)
         ======================= -->
    <div id="auth-screen" class="auth-container">
        
        <!-- Login Form -->
        <div id="login-view" class="auth-card">
            <div class="auth-logo"><i class="fas fa-book-reader"></i></div>
            <h2 class="auth-title">Welcome Back!</h2>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your registered email">
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>

            <button class="btn-primary" onclick="attemptLogin()">Login</button>
            
            <p id="loginError" class="auth-alert">Invalid Email or Password</p>
            
            <div class="toggle-link" onclick="switchToRegister()">Create Account</div>
        </div>

        <!-- Register Form (Hidden Initially) -->
        <div id="register-view" class="auth-card" style="display: none;">
            <div class="auth-logo"><i class="fas fa-user-plus"></i></div>
            <h2 class="auth-title">Create Account</h2>
            
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="John Doe">
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="john@example.com">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Create a password">
            </div>

            <button class="btn-primary" onclick="attemptRegister()">Register Account</button>
            
            <p id="regError" class="auth-alert" style="color:var(--accent-color)">Please fill all fields correctly.</p>

            <div class="toggle-link" onclick="switchToLogin()">Already have an account? Login</div>
        </div>

    </div>

    <!-- ======================= 
         MAIN SYSTEM (Books & Admin Panel)
         ======================= -->
    <div id="system-interface">
        <div class="container">
            <header>
                <div style="display:flex; align-items:center; gap:10px;">
                    <h2><i class="fas fa-book-open"></i> Library Dashboard</h2>
                    <div class="user-info" id="userInfoDisplay">
                        <!-- User details appear here after login -->
                    </div>
                </div>
                <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </header>

            <!-- Add Book Form -->
            <div class="book-form">
                <input type="text" id="titleInput" placeholder="Book Title">
                <input type="text" id="authorInput" placeholder="Author Name">
                <input type="number" id="yearInput" placeholder="Year (e.g., 2023)">
                <input type="text" id="isbnInput" placeholder="ISBN Number">
                <button onclick="addBook()">Add Book</button>
            </div>

            <!-- Search -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by title or author...">
                <button onclick="searchBooks()"><i class="fas fa-search"></i></button>
            </div>

            <!-- Book List -->
            <h3>All Books</h3>
            <br>
            <div id="bookList" class="book-grid">
                <!-- JS will inject books here -->
            </div>
        </div>
    </div>

<script>
    // --- DATA STORAGE (LocalStorage) ---
    let books = JSON.parse(localStorage.getItem('libraryBooks')) || [];
    let users = JSON.parse(localStorage.getItem('libraryUsers')) || [];

    // --- UI ELEMENTS ---
    const authScreen = document.getElementById('auth-screen');
    const loginView = document.getElementById('login-view');
    const registerView = document.getElementById('register-view');
    const systemInterface = document.getElementById('system-interface');
    
    // Login Fields
    const loginEmail = document.getElementById('loginEmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginError = document.getElementById('loginError');

    // Register Fields
    const regName = document.getElementById('regName');
    const regEmail = document.getElementById('regEmail');
    const regPassword = document.getElementById('regPassword');
    const regError = document.getElementById('regError');

    // Book Elements
    const titleInput = document.getElementById('titleInput');
    const authorInput = document.getElementById('authorInput');
    const yearInput = document.getElementById('yearInput');
    const isbnInput = document.getElementById('isbnInput');
    const searchInput = document.getElementById('searchInput');
    const bookList = document.getElementById('bookList');

    // ======================= 
    // AUTHENTICATION FUNCTIONS 
    // ======================= 

    // Switch between Login and Register views
    function switchToRegister() {
        loginView.style.display = 'none';
        registerView.style.display = 'block';
    }

    function switchToLogin() {
        registerView.style.display = 'none';
        loginView.style.display = 'block';
    }

    // Register New User
    function attemptRegister() {
        const name = regName.value.trim();
        const email = regEmail.value.trim().toLowerCase();
        const password = regPassword.value;

        if (!name || !email || !password) {
            showError(regError, "Please fill in all fields.");
            return;
        }

        // Check if user already exists
        if (users.find(u => u.email === email)) {
            showError(regError, "Account with this email already exists!");
            return;
        }

        // Save User
        const newUser = { id: Date.now(), name, email, password };
        users.push(newUser);
        localStorage.setItem('libraryUsers', JSON.stringify(users));

        alert("Registration Successful! You can now login.");
        switchToLogin();
    }

    // Login User (Admin & Normal Users)
    function attemptLogin() {
        const email = loginEmail.value.trim().toLowerCase();
        const password = loginPassword.value;

        // Check Admin First
        if (email === "admin@lib.com" && password === "1234") {
            alert("Welcome, Administrator! You can add/delete books.");
            loginUser({ name: "Administrator", email: "admin@lib.com", role: "Admin" });
            return;
        }

        // Check Normal User
        const user = users.find(u => u.email === email && u.password === password);
        
        if (user) {
            alert("Welcome, " + user.name + "!");
            loginUser({ name: user.name, email: user.email, role: "User" });
        } else {
            showError(loginError, "Invalid Email or Password.");
        }
    }

    // Helper to show error messages
    function showError(element, message) {
        element.innerText = message;
        element.style.display = 'block';
        setTimeout(() => element.style.display = 'none', 3000);
    }

    // ======================= 
    // SYSTEM FUNCTIONS (Books)
    // ======================= 

    function loginUser(userObj) {
        // Hide Auth Screen, Show System
        authScreen.style.display = 'none';
        systemInterface.style.display = 'block';
        
        // Update Header User Info
        const userDisplay = document.getElementById('userInfoDisplay');
        userDisplay.innerHTML = `
            <div class="user-avatar"><i class="fas fa-user"></i></div>
            <div>
                <strong>${userObj.name}</strong><br>
                <small style="color:var(--primary-color)">${userObj.role} Account</small>
            </div>
        `;

        renderBooks(books); // Load initial books
    }

    function logout() {
        // Reset Inputs
        loginEmail.value = '';
        loginPassword.value = '';
        
        systemInterface.style.display = 'none';
        authScreen.style.display = 'flex';
    }

    // --- Book System Logic (Admin & User functions are the same, Admin can do more in future) ---

    function addBook() {
        const title = titleInput.value;
        const author = authorInput.value;
        const year = yearInput.value;
        const isbn = isbnInput.value;

        if (title === '' || author === '' || year === '' || isbn === '') {
            alert('Please fill in all fields!');
            return;
        }

        const newBook = {
            id: Date.now(), 
            title,
            author,
            year,
            isbn,
            status: 'Available' // Books start as Available
        };

        books.push(newBook);
        saveAndRender();
        
        // Clear inputs
        titleInput.value = '';
        authorInput.value = '';
        yearInput.value = '';
        isbnInput.value = '';
    }

    function borrowBook(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.status = 'Issued';
            saveAndRender();
        }
    }

    function returnBook(id) {
        const book = books.find(b => b.id === id);
        if (book) {
            book.status = 'Available';
            saveAndRender();
        }
    }

    function deleteBook(id) {
        if(confirm('Delete this book permanently?')) {
            books = books.filter(b => b.id !== id);
            saveAndRender();
        }
    }

    function searchBooks() {
        const keyword = searchInput.value.toLowerCase();
        const filteredBooks = books.filter(book => 
            book.title.toLowerCase().includes(keyword) || 
            book.author.toLowerCase().includes(keyword)
        );
        renderBooks(filteredBooks);
    }

    function saveAndRender() {
        localStorage.setItem('libraryBooks', JSON.stringify(books));
        if(searchInput.value) {
            searchBooks();
        } else {
            renderBooks(books);
        }
    }

    function renderBooks(bookArray) {
        bookList.innerHTML = ''; 
        
        if (bookArray.length === 0) {
            bookList.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#7f8c8d;">No books found.</p>';
            return;
        }

        bookArray.forEach(book => {
            const card = document.createElement('div');
            card.classList.add('book-card');

            const statusClass = book.status === 'Available' ? 'status-available' : 'status-issued';
            const statusText = book.status === 'Available' ? 'Available' : 'Issued';

            card.innerHTML = `
                <span class="status-badge ${statusClass}">${statusText}</span>
                <h2>${book.title}</h2>
                <p><i class="fas fa-user"></i> ${book.author}</p>
                <small><i class="fas fa-calendar-alt"></i> ${book.year}</small>
                <br>
                <strong>ISBN: </strong> <span style="font-family: monospace;">${book.isbn}</span>

                <div class="action-btns">
                    ${book.status === 'Available' 
                        ? `<button onclick="borrowBook(${book.id})" class="borrow-btn"><i class="fas fa-hand-holding"></i> Borrow</button>` 
                        : ''}
                    
                    ${book.status === 'Issued' 
                        ? `<button onclick="returnBook(${book.id})" class="return-btn"><i class="fas fa-check"></i> Return</button>` 
                        : ''}

                    <button onclick="deleteBook(${book.id})" style="background-color:#e74c3c;"><i class="fas fa-trash"></i></button>
                </div>
            `;
            
            bookList.appendChild(card);
        });
    }
</script>

</body>
</html>
